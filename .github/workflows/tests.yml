name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Unit tests only need these; the embedding model is not downloaded in CI
      - run: pip install pytest numpy
      - run: pytest -v
